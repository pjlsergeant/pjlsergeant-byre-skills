# Companion of the codex agent skill: codex-security bundles its own codex
# binary (the @openai/codex npm dependency) but authenticates by reading
# auth.json from $CODEX_HOME -- the codex skill's state volume -- so the box's
# existing codex login (per-box device-auth or shared-auth alike) just works,
# and this skill needs no login flow, volume, or egress of its own.
companion_for = "codex"

[package]
id = "pjlsergeant/codex-security"
version = "1.1.0"
kind = "skill"
package_api = 1
requires_byre = ">=1.2.0"
description = "OpenAI's codex-security scanner -- scan, validate, patch and export security findings, riding the codex skill's credential."

[build]
# python3: the bundled plugin runtime needs python >= 3.10 (bookworm ships
# 3.11). curl/ca-certificates for the NodeSource step below.
apt = ["curl", "ca-certificates", "python3"]
dockerfile = [
  # Node 22 (the package's engines floor; Debian's own nodejs is too old)
  # via NodeSource, then the CLI itself, installed global so `codex-security`
  # is on PATH in agent and attach shells alike.
  "RUN curl -fsSL https://deb.nodesource.com/setup_22.x | bash - \\",
  " && apt-get install -y --no-install-recommends nodejs \\",
  " && rm -rf /var/lib/apt/lists/*",
  "RUN npm install -g @openai/codex-security",
]

# No [runtime] egress: inference and auth ride the codex skill's grants
# (api.openai.com, auth.openai.com, chatgpt.com). The optional `bulk-scan`
# GitHub discovery wants api.github.com -- a box that uses that verb grants
# it in its own config (convenience never justifies a default grant).

# LARGE WARNING: these flags remove the box's syscall filter and LSM
# confinement. The scan agent runs inside bubblewrap, which needs
# unprivileged user namespaces; Docker's default seccomp blocks creating
# them and docker-default AppArmor denies the mounts bwrap makes next, so
# without these flags every scan fails (empty output, misleading save
# error -- upstream #20). What remains of the boundary: namespaces,
# capabilities, mounts, the runtime. Mount nothing into a box running this
# skill that you wouldn't hand to the scan agent. Ubuntu 24.04+ hosts must
# ALSO set kernel.apparmor_restrict_unprivileged_userns=0 (see context.md)
# -- a host sysctl no skill can ship. byre surfaces these raw flags in the
# grant review and degrades the box's claims in status; both are correct.
# Recipe verified end-to-end 2026-07-30 (probe matrix in context.md).
[runtime]
run_args = ["--security-opt", "seccomp=unconfined", "--security-opt", "apparmor=unconfined"]

[context]
file = "context.md"

# Distribution payload list -- generated by `byre skill pack`.
[[package.files]]
src = "context.md"
dest = "context.md"
sha256 = "32d3db24ef73b02f7ae17b12c40a386e5f63409343558aa3a697e192ff0ab966"

