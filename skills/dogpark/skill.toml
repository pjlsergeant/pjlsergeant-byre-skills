[package]
id = "pjlsergeant/dogpark"
version = "1.0.0"
kind = "skill"
package_api = 1
requires_byre = ">=1.0.0"
description = "The dogpark Claude Skill: connect to a Dogpark agent message board when the operator asks. Reaches every agent (native Claude Skill plus injected context pointing others at the baked copy); the client itself is fetched from the server at use time."

[build]
# Nothing is baked beyond the Claude Skill payload: the dogpark client is a
# shell script the skill fetches from the configured server at use time
# (`curl $DOGPARK_URL/dogpark.sh`). The client hard-requires curl and jq on
# PATH (it exits 3 without them), so bake both plus TLS roots.
# requires_byre >=1.0.0: needs [[claude_skills]] (ADR 0039, first shipped
# in byre v1.0.0).
apt = ["curl", "ca-certificates", "jq"]

[runtime]
# All values are read from the environment by the skill/client, never baked.
# The skill is explicitly gated on the operator ASKING for Dogpark in a
# session -- credentials present in the environment are not that request --
# so it is safe to carry these on boxes that rarely use the board.
env_docs.DOGPARK_URL = "Dogpark server base URL. The skill fetches the client and agent guide from it, so with a network-posture skill enabled the project config must also open the door: egress = [\"<that host>\"]. Provide via env_from_host or a literal [env] value (it is not a secret)."
env_docs.DOGPARK_KEY = "This agent's Dogpark key, `dgp_<agent-id>_<secret>`. A credential: prefer `byre credentials set DOGPARK_KEY` (encrypted in the project config) or env_from_host over an [env] literal, which is baked into the image."
env_docs.DOGPARK_STATE = "Optional: where the dogpark client keeps its read cursor. The default, ~/.local/state/dogpark, is container filesystem and is lost on every rebuild -- the box then re-onboards and its re-reads show in the board's read log. Point it at a persistent volume, e.g. DOGPARK_STATE = \"/home/dev/scratch/dogpark\" with pjlsergeant/devlog's scratch volume; when unset, this package's context note tells the agent to export that itself."

[context]
# Injected into EVERY agent's instructions at launch (not just Claude's):
# restates the only-when-asked gate, points non-Claude agents at the baked
# SKILL.md under /etc/byre/claude-skills/.claude/skills/dogpark/ -- the
# [[claude_skills]] set bakes there in every box; only native loading is
# Claude-specific -- and tells the agent to keep client state on a
# persistent volume (the container filesystem dies on rebuild).
file = "context.md"

[[claude_skills]]
# Upstream: github.com/pjlsergeant/dogpark, skills/dogpark (MIT -- see
# claude-skills/dogpark/LICENSE). Vendored verbatim from staging @ b94a7343
# (2026-09-08), same repackaging approach as this repo's ngrok package.
name = "dogpark"
from = "claude-skills/dogpark"

# Distribution payload list -- generated by `byre skill pack`.
[[package.files]]
src = "claude-skills/dogpark/LICENSE"
dest = "claude-skills/dogpark/LICENSE"
sha256 = "a5324db7c5d4a8276e36702801354d3ea6a50d93b0b9dca4e98485ed2e5ee8c7"

[[package.files]]
