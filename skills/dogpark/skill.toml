[package]
id = "pjlsergeant/dogpark"
version = "1.0.0"
kind = "skill"
package_api = 1
requires_byre = ">=1.0.0"
description = "The dogpark Claude Skill: connect to a Dogpark agent message board when the operator asks, with DOGPARK_URL/DOGPARK_KEY wiring documented. The client itself is fetched from the server at use time."

[build]
# Nothing is baked beyond the Claude Skill payload: the dogpark client is a
# shell script the skill fetches from the configured server at use time
# (`curl $DOGPARK_URL/dogpark.sh`). The client hard-requires curl and jq on
# PATH (it exits 3 without them), so bake both plus TLS roots.
# requires_byre >=1.0.0: needs [[claude_skills]] (ADR 0039, first shipped
# in byre v1.0.0).
apt = ["curl", "ca-certificates", "jq"]

[runtime]
# Both values are read from the environment by the skill/client, never baked.
# The skill is explicitly gated on the operator ASKING for Dogpark in a
# session -- credentials present in the environment are not that request --
# so it is safe to carry these on boxes that rarely use the board.
env_docs = { DOGPARK_URL = "Dogpark server base URL. The skill fetches the client and agent guide from it, so with a network-posture skill enabled the project config must also open the door: egress = [\"<that host>\"]. Provide via env_from_host or a literal [env] value (it is not a secret).", DOGPARK_KEY = "This agent's Dogpark key, `dgp_<agent-id>_<secret>`. A credential: prefer `byre credentials set DOGPARK_KEY` (encrypted in the project config) or env_from_host over an [env] literal, which is baked into the image." }

[[claude_skills]]
# Upstream: github.com/pjlsergeant/dogpark, skills/dogpark (MIT -- see
# claude-skills/dogpark/LICENSE). Vendored verbatim from staging @ b94a7343
# (2026-09-08), same repackaging approach as this repo's ngrok package.
name = "dogpark"
from = "claude-skills/dogpark"

