[package]
id = "pjlsergeant/prok"
version = "1.0.0"
kind = "skill"
package_api = 1
requires_byre = ">=0.1.10"
description = "frpc client for a self-hosted prok relay (frps behind Cloudflare): claim https://<name>.<relay> for as long as the process stays connected. Auth and relay host come from PROK_AUTHTOKEN / PROK_RELAY at use time."

[build]
# frp isn't packaged for Debian, so this fetches fatedier/frp's release
# tarball from GitHub, pinned to v0.71.0 and verified against the sha256s
# from that release's frp_sha256_checksums.txt (both values cross-checked
# against an independent download on 2026-09-14). Only the single static
# `frpc` binary ships; frps and the sample configs are discarded. No baked
# config, firstrun hook, or state volume: the context note has the agent
# write a throwaway config at use time whose token/relay values are frpc
# {{ .Envs }} templates -- resolved from the environment by frpc itself,
# never stored. (A config file rather than the `frpc http` one-liner
# because only the config can set transport.tls.trustedCaFile; without it
# frpc v0.71.0 skips server certificate verification, wss included --
# verified live against a wrong-CN cert.)
apt = ["curl", "ca-certificates"]
dockerfile = [
  "RUN arch=\"$(dpkg --print-architecture)\" \\",
  " && case \"$arch\" in \\",
  "      amd64) sha=84f27e39f11169f7adcef8e8b70c9329de17747b1f14dad9fb95eef5682ea716 ;; \\",
  "      arm64) sha=f33c293c275d8fc68c654b6fba8f10b2551d6463d09a9fc9cffb7227eae82266 ;; \\",
  "      *) echo \"prok: unsupported arch: $arch\" >&2; exit 1 ;; \\",
  "    esac \\",
  " && curl -fsSL -o /tmp/frp.tgz \"https://github.com/fatedier/frp/releases/download/v0.71.0/frp_0.71.0_linux_${arch}.tar.gz\" \\",
  " && echo \"$sha  /tmp/frp.tgz\" | sha256sum -c - \\",
  " && tar -xzf /tmp/frp.tgz -C /tmp \"frp_0.71.0_linux_${arch}/frpc\" \\",
  " && install -m 0755 \"/tmp/frp_0.71.0_linux_${arch}/frpc\" /usr/local/bin/frpc \\",
  " && rm -rf /tmp/frp.tgz \"/tmp/frp_0.71.0_linux_${arch}\"",
]

[runtime]
# No static egress block: the relay hostname is deployment-specific
# (PROK_RELAY), so the project config must open the door itself -- same
# arrangement as dogpark's DOGPARK_URL. Documented per-var below so the
# config editor's env screen surfaces it.
env_docs.PROK_AUTHTOKEN = "prok shared secret, required. A credential: prefer `byre credentials set PROK_AUTHTOKEN` (encrypted in the project config) or env_from_host over an [env] literal, which is baked into the image. Referenced from frpc's config via its {{ .Envs }} templating, so it is resolved from the environment at connect time and never written to disk."
env_docs.PROK_RELAY = "prok relay base hostname, required (tunnels come up at https://<name>.<this host>). Not a secret -- env_from_host or a literal [env] value both fine. With a network-posture skill enabled the project config must also open the door: egress = [\"<this host>\"] -- the control channel is a WebSocket to it on 443 (nothing on 7000); add <name>.<this host> too if the box should curl its own tunnels."

[context]
file = "context.md"

# Distribution payload list -- generated by `byre skill pack`.
[[package.files]]
src = "context.md"
dest = "context.md"
sha256 = "4ee21dbce2928d985cc82263f5059849de609cde1198f5dd6770317886c32bd7"
