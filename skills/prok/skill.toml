[package]
id = "pjlsergeant/prok"
version = "1.0.0"
kind = "skill"
package_api = 1
requires_byre = ">=0.1.10"
description = "prok, a self-hosted ngrok: claim https://<name>.<relay> for as long as the tunnel process lives. Ships frpc plus a `prok` wrapper (up/status/down) that fails fast on taken names via frpc's admin API. Auth and relay host come from PROK_AUTHTOKEN / PROK_RELAY at use time."

[build]
# frp isn't packaged for Debian, so this fetches fatedier/frp's release
# tarball from GitHub, pinned to v0.71.0 and verified against the sha256s
# from that release's frp_sha256_checksums.txt (both values cross-checked
# against an independent download on 2026-09-14). Only the single static
# `frpc` binary ships; frps and the sample configs are discarded. On top
# of it goes the `prok` wrapper (this package's own script): it writes a
# throwaway per-tunnel config whose token/relay values are frpc
# {{ .Envs }} templates -- resolved from the environment by frpc itself,
# never stored -- and which pins transport.tls.trustedCaFile (without it
# frpc v0.71.0 skips server certificate verification, wss included --
# verified live against a wrong-CN cert), then polls frpc's local admin
# API so a taken name is a fast non-zero exit instead of frpc's silent
# retry-forever. jq parses that API's JSON. No firstrun hook or state
# volume: per-tunnel state is process-bound and lives in /tmp.
apt = ["curl", "ca-certificates", "jq"]
# The wrapper script; payload COPYs land before this block's RUN lines
# (gen.SkillBlock: "COPY'd before raw lines"), and a fetched payload
# carries no exec bit, hence the chmod below.
files = { "prok" = "/usr/local/bin/prok" }
dockerfile = [
  "RUN arch=\"$(dpkg --print-architecture)\" \\",
  " && case \"$arch\" in \\",
  "      amd64) sha=84f27e39f11169f7adcef8e8b70c9329de17747b1f14dad9fb95eef5682ea716 ;; \\",
  "      arm64) sha=f33c293c275d8fc68c654b6fba8f10b2551d6463d09a9fc9cffb7227eae82266 ;; \\",
  "      *) echo \"prok: unsupported arch: $arch\" >&2; exit 1 ;; \\",
  "    esac \\",
  " && curl -fsSL -o /tmp/frp.tgz \"https://github.com/fatedier/frp/releases/download/v0.71.0/frp_0.71.0_linux_${arch}.tar.gz\" \\",
  " && echo \"$sha  /tmp/frp.tgz\" | sha256sum -c - \\",
  " && tar -xzf /tmp/frp.tgz -C /tmp \"frp_0.71.0_linux_${arch}/frpc\" \\",
  " && install -m 0755 \"/tmp/frp_0.71.0_linux_${arch}/frpc\" /usr/local/bin/frpc \\",
  " && rm -rf /tmp/frp.tgz \"/tmp/frp_0.71.0_linux_${arch}\"",
  "RUN chmod 0755 /usr/local/bin/prok",
]

[runtime]
# No static egress block: the relay hostname is deployment-specific
# (PROK_RELAY), so the project config must open the door itself -- same
# arrangement as dogpark's DOGPARK_URL. Documented per-var below so the
# config editor's env screen surfaces it.
# byre holds each env_docs value to the one-liner shape (single line,
# <=300 bytes); longer guidance lives in context.md, which already carries
# the templating and nothing-on-7000 detail.
env_docs.PROK_AUTHTOKEN = "prok shared secret, required. A credential: prefer `byre credentials set PROK_AUTHTOKEN` or env_from_host over a baked [env] literal. Mint it from letters, digits, - and _ only: frpc splices it into its config as raw text, so a quote or newline in the token breaks parsing."
env_docs.PROK_RELAY = "prok relay base hostname, required; not a secret (tunnels come up at https://<name>.<this host>). With a network-posture skill enabled the project config must also open the door: egress = [\"<this host>\"] -- the control channel is a WebSocket to it on 443."

[context]
file = "context.md"

# Distribution payload list -- generated by `byre skill pack`.
