[package]
id = "pjlsergeant/codereview"
version = "1.9.0"
kind = "skill"
package_api = 1
requires_byre = ">=0.1.10"
description = "byre-codereview — the independent second-opinion review loop (codex, grok, claude, opencode, mimo, zai, vibe)."

[build]
apt = ["jq"] # codereview.sh parses codex --json, opencode/mimo --format json and vibe --output json output with jq
files = { "codereview.sh" = "/usr/local/bin/byre-codereview", "devlog-lib.sh" = "/usr/local/lib/byre-devlog-lib.sh", "codex-login.sh" = "/usr/local/bin/codex-login", "grok-login.sh" = "/usr/local/bin/grok-login" }
# The login helpers are deliberately UNPREFIXED: they wrap the vendors' own
# CLIs, so `codex-login` reads as "log codex in" rather than as byre machinery.
dockerfile = ["RUN chmod +x /usr/local/bin/byre-codereview /usr/local/bin/codex-login /usr/local/bin/grok-login"]

[context]
file = "context.md"

