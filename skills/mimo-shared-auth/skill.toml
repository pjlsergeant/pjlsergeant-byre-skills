# Offer this as pjlsergeant/mimo's shared-auth companion during onboarding and
# nest it beneath that agent in byre's config UI. This must precede [package]
# so it remains top-level TOML rather than package metadata.
shared_auth_for = "pjlsergeant/mimo"

[package]
id = "pjlsergeant/mimo-shared-auth"
version = "1.0.0"
kind = "skill"
package_api = 1
requires_byre = ">=1.0.0"
description = "Share one static Xiaomi MiMo API key, and a default model (MIMO_MODEL), across byre projects that use pjlsergeant/mimo."

[build]
# 00- sorts this firstrun hook before pjlsergeant/mimo's mimo-login, which
# stands down on the key file this one writes (env.d runs after ALL firstrun
# hooks, so the login hook cannot wait for the export).
files = { "firstrun.sh" = "/etc/byre/firstrun.d/00-mimo-shared-auth", "env.sh" = "/etc/byre/env.d/50-mimo-shared-auth.sh" }

[context]
file = "context.md"

[[volumes]]
name = "mimo-identity"
role = "state"
target = "/home/dev/.byre-identity/mimo"
scope = "machine"

# Distribution payload list -- generated by `byre skill pack`.
[[package.files]]
src = "context.md"
dest = "context.md"
sha256 = "40f5af0d6b22674bb30a3008244dec8e65fced20e0c82556f6ae9e59cc63ace3"

[[package.files]]
src = "env.sh"
dest = "env.sh"
sha256 = "6f9b396ad55935ab32e4bf4578e1418b66f6dde893f0c2186e751310cd58dc40"

[[package.files]]
src = "firstrun.sh"
dest = "firstrun.sh"
sha256 = "c9ad6d7180c3b0c9b9f6049e1936a8bcc983df89e7584c9c9775815286e04f10"
executable = true

