[package]
id = "pjlsergeant/devlog"
version = "1.0.0"
kind = "skill"
package_api = 1
requires_byre = ">=0.1.10"
description = "Dev-workflow conventions: diary, devlog dir, scratch volume."

[build]
files = { "devlog-firstrun.sh" = "/etc/byre/firstrun.d/devlog", "devlog-lib.sh" = "/usr/local/lib/byre-devlog-lib.sh" }

[runtime]
# Advertise the scratch volume so the agent and scripts can find it without
# hardcoding the path.
env = { BYRE_SCRATCH = "/home/dev/scratch" }

[context]
file = "context.md"

# The agent's persistent stash. The container fs (including /tmp) is throwaway —
# it dies on every restart and rebuild, which happens constantly when byre
# develops itself (--self-edit restarts to apply config changes). This named
# volume survives those. role=state: persistence is the point; clearing it is a
# conscious data loss, not a cache eviction.
[[volumes]]
name = "scratch"
role = "state"
target = "/home/dev/scratch"

# Distribution payload list -- generated by `byre skill pack`.
[[package.files]]
src = "context.md"
dest = "context.md"
sha256 = "75cf8de6c8519e16740e22b80577952568ece85e98884742f70341ea788ef828"

[[package.files]]
src = "devlog-firstrun.sh"
dest = "devlog-firstrun.sh"
sha256 = "9ef00661834ab959dcf588bc8bd252eb5734c74db066f4476caa50bf348adbc4"

[[package.files]]
src = "devlog-lib.sh"
dest = "devlog-lib.sh"
sha256 = "5185248222819894db73326bfc9825b0c3b819d4bf1d9ddce2a72bc4f018e7ba"

