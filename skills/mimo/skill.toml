# Evidence status. LIVE-verified against the mimo 0.1.15 binary (the npm
# linux-x64 artifact, run outside byre, 2026-10-01): the XDG state split
# (`mimo debug paths`), the paste-code `mimo auth login -p xiaomi` flow, the
# XIAOMI_API_KEY env key, the dead free channel; and byre-mimo-model
# (2026-10-02) with a real tp- key (sgp detected, cache written and hit,
# MIMO_MODEL override, bogus key), end to end through mimo-launch.sh and
# `mimo run`. SOURCE-verified against the XiaomiMiMo/MiMo-Code tree (refs
# inline): the runtime knobs below. NOT exercised: the image build (no docker
# in the authoring box; the download RUN was simulated in bash against a temp
# prefix), the arm64 artifact beyond its registry checksum, a byre box
# resolving the injected MCP servers (`mimo mcp list`), and the region probes
# through byre's egress firewall.

[package]
id = "pjlsergeant/mimo"
version = "1.2.1"
kind = "skill"
package_api = 1
requires_byre = ">=1.3.0"
description = "The MiMo Code agent (Xiaomi's MIT-licensed opencode fork, binary `mimo`, pinned 0.1.15); paste-code Xiaomi login (`mimo-login` in byre shell) or XIAOMI_API_KEY, persisted per project."

[build]
# jq: the launch adapter builds MIMOCODE_CONFIG_CONTENT from the baked
# /etc/byre/mcp.json with it, and byre-mimo-model parses the Token Plan
# /v1/models answer. curl + ca-certificates: the pinned download, and
# byre-mimo-model's region probe.
apt = ["curl", "ca-certificates", "jq"]
# mimo-login.sh: first-run auth hook (paste-code Xiaomi platform login,
# guarded by auth.json / XIAOMI_API_KEY; skippable with Ctrl-C; trusts
# pjlsergeant/mimo-shared-auth's auth.json link).
# mimo-login-cmd.sh: `mimo-login`, the by-hand login from `byre shell` -- a
# thin wrapper of `mimo auth login -p xiaomi` that refuses without a TTY and
# shows `mimo auth whoami` after (the codereview skill's codex-login shape).
# mimo-launch.sh: the agent launch adapter -- MCP + context injection via
# MIMOCODE_CONFIG_CONTENT, then exec mimo (port of byre's opencode adapter).
# byre-mimo-model: the model resolver both the adapter and byre-codereview's
# bare `--reviewer mimo` call -- MIMO_MODEL, else a Token Plan key's region
# detected by probing the three token-plan hosts (cached in the data
# volume), else nothing. Installed beside the adapter, which looks there
# first.
# Payload COPYs land before this block's RUN lines; a fetched payload
# carries no exec bit, hence the chmod (firstrun hooks run as `bash "$hook"`
# so the hook needs none).
files = { "mimo-login.sh" = "/etc/byre/firstrun.d/mimo-login", "mimo-login-cmd.sh" = "/usr/local/bin/mimo-login", "mimo-launch.sh" = "/usr/local/bin/byre-mimo-launch", "byre-mimo-model" = "/usr/local/bin/byre-mimo-model" }
dockerfile = [
  # Pre-create ~/.local's XDG tree AS THE DEV USER (byre's opencode skill
  # precedent): the state volume targets /home/dev/.local/share/mimocode,
  # and byre's volume-mount-point layer (`mkdir -p` as root, chown of the
  # LEAF only) would otherwise bake /home/dev/.local and .local/share
  # root-owned -- breaking mimo's state/locks dir (~/.local/state/mimocode)
  # and ~/.local/bin for every other tool.
  "RUN gosu dev mkdir -p /home/dev/.local/share /home/dev/.local/state /home/dev/.local/bin",
  # Install source: the npm PLATFORM packages, not the official
  # `curl https://mimo.xiaomi.com/install` script -- that pulls from a Xiaomi
  # FDS host which timed out from a box and publishes no checksums. Each
  # tarball is a standalone Bun-compiled binary (~135 MB, no node needed)
  # at package/bin/mimo. Pinned to 0.1.15; both sha256s cross-checked
  # against the registry's sha512 `integrity` field on 2026-10-01. The x64
  # build needs AVX2 (Bun non-baseline); npm also ships
  # mimocode-linux-x64-baseline for older CPUs -- not handled here.
  "RUN arch=\"$(dpkg --print-architecture)\" \\",
  " && case \"$arch\" in \\",
  "      amd64) npmarch=x64; sha=6bacf2e13878f5484e9b29003bacf082c01d2d4e486c6f53750b64620c0d9a9d ;; \\",
  "      arm64) npmarch=arm64; sha=6b3ea8d29064de944019d68bc0bd1eef11db22ead47f455f50ed58ef2b815f33 ;; \\",
  "      *) echo \"mimo: unsupported arch: $arch\" >&2; exit 1 ;; \\",
  "    esac \\",
  " && mkdir -p /tmp/mimo \\",
  " && curl -fsSL -o /tmp/mimo/mimo.tgz \"https://registry.npmjs.org/@mimo-ai/mimocode-linux-${npmarch}/-/mimocode-linux-${npmarch}-0.1.15.tgz\" \\",
  " && echo \"$sha  /tmp/mimo/mimo.tgz\" | sha256sum -c - \\",
  " && tar -xzf /tmp/mimo/mimo.tgz -C /tmp/mimo package/bin/mimo \\",
  " && install -m 0755 /tmp/mimo/package/bin/mimo /usr/local/bin/mimo \\",
  " && rm -rf /tmp/mimo",
  # Fail the BUILD loudly if the tarball layout ever moves.
  "RUN test -x /usr/local/bin/mimo",
  "RUN chmod 0755 /usr/local/bin/byre-mimo-launch /usr/local/bin/byre-mimo-model /usr/local/bin/mimo-login",
]

[runtime]
# MIMOCODE_DISABLE_AUTOUPDATE (flag.ts:98): the image pins the version, and
# self-update would need the Xiaomi FDS host, which ships closed.
# MIMOCODE_ENABLE_ANALYSIS=false (flag.ts:107 -- defaults ON): stops the
# metrics POST to https://tracking.miui.com/track/v4/o (metrics/client.ts:1).
# NOT set, deliberately: MIMOCODE_MIMO_ONLY -- it would also disable the
# env-key provider detection XIAOMI_API_KEY relies on (flag.ts:230).
env = { MIMOCODE_DISABLE_AUTOUPDATE = "true", MIMOCODE_ENABLE_ANALYSIS = "false" }
# byre holds each env_docs value to one line, <=300 bytes; the longer
# guidance lives in context.md. XIAOMI_API_KEY is the models.dev name for
# provider `xiaomi` and the Token Plan providers xiaomi-token-plan-
# {cn,ams,sgp} alike. A tp- key 401s on `xiaomi`, but byre-mimo-model routes
# it: GET /v1/models answers 200 only on the key's own region (all verified
# live 2026-10-01, sgp), so a Token Plan box needs the key and nothing else.
env_docs.XIAOMI_API_KEY = "Xiaomi MiMo API key, alternative to the paste-code login; set via byre credentials or env_from_host, never [env]. Any value in the env stands the login hook down (a byre credentials one only on byre 1.12+). A Token Plan (tp-) key is routed to its regional provider."
# MIMO_MODEL is read by byre-mimo-model, which both mimo-launch.sh (folded
# into MIMOCODE_CONFIG_CONTENT as `model`) and byre-codereview's bare
# `--reviewer mimo` call. Not a secret: a plain [env] literal is fine.
env_docs.MIMO_MODEL = "Optional override of the mimo agent's and a bare --reviewer mimo's model, as provider/model, e.g. xiaomi-token-plan-sgp/mimo-v2.6-pro. Plain [env] value, not a secret. Token Plan (tp-) keys are detected automatically; run byre-mimo-model to see the model in use."
# Egress (443). api.xiaomimimo.com = inference; platform.xiaomimimo.com =
# the OAuth authorize page + code callback of `mimo auth login -p xiaomi`;
# models.dev = the provider/model catalog (functional, as for byre's
# opencode skill). token-plan-{cn,ams,sgp}.xiaomimimo.com = the inference
# hosts of the regional Token Plan providers (api
# https://token-plan-<region>.xiaomimimo.com/v1, per models.dev; the sgp one
# verified live 2026-10-01 with a tp- key) -- the skill's own functional
# endpoints for a Token Plan account, so open with the skill like
# api.xiaomimimo.com. All three rather than the user's one: the region is
# not known at install time -- byre-mimo-model finds it by probing all
# three (GET /v1/models with the key), so all three must be reachable for a
# tp- key to work with no configuration. They carry only Xiaomi inference,
# the same trust as api.xiaomimimo.com.
# A login whose result carries a custom base_url needs that host opened via
# the project config's egress.
# Deliberately closed: tracking.miui.com (analytics, also disabled by env),
# mimocode.cnbj1.mi-fds.com (self-update), registry.npmjs.org (mimo's
# background `@mimo-ai/plugin` install per config dir, config.ts ~866 --
# it warns and continues).
egress = ["api.xiaomimimo.com", "platform.xiaomimimo.com", "models.dev", "token-plan-cn.xiaomimimo.com", "token-plan-ams.xiaomimimo.com", "token-plan-sgp.xiaomimimo.com"]
# mimo.xiaomi.com = install script / update check / config $schema. Not
# needed to run; offered as a switch, ships closed.
egress_offered = ["mimo.xiaomi.com"]

[context]
file = "context.md"

[agent]
# MIMOCODE_DANGEROUSLY_SKIP_PERMISSIONS=1: an allow-all permission base
# merged UNDER the user's config, so explicit denies still win
# (config.ts:972). The env form rather than the CLI flag because the TUI
# shows a red accept-gate for the FLAG whenever stdin is a TTY
# (cli/cmd/tui/thread.ts:251) -- the env var gives the same posture with no
# per-launch prompt. --trust skips the workspace-trust prompt
# (thread.ts:199). byre-mimo-launch injects MCP servers and the baked agent
# context through MIMOCODE_CONFIG_CONTENT (see mimo-launch.sh) -- pure
# injection; byre writes nothing into ~/.config/mimocode.
command = "env MIMOCODE_DANGEROUSLY_SKIP_PERMISSIONS=1 byre-mimo-launch --trust"
mcp = "inject"
context = "inject"
state = ".mimocode"

# No host-seeded auth: log in per box via the firstrun hook or `mimo-login`
# (the .mimocode volume persists auth.json across rebuilds), or enable the
# optional pjlsergeant/mimo-shared-auth companion, which symlinks auth.json
# into a machine-scoped identity volume so one login serves every project
# (the login hook trusts exactly that link).

[[volumes]]
name = ".mimocode"
role = "state"
# The XDG DATA dir only (auth.json, mimocode.db sessions, memory, logs --
# `mimo debug paths`); config/cache/state stay in the image layer (the
# opencode precedent). First run performs a SQLite migration into it. Do NOT
# relocate XDG_DATA_HOME or set MIMOCODE_HOME via config [env]: mimo would
# follow, this mount would not, and the login would stop surviving rebuilds.
target = "/home/dev/.local/share/mimocode"

