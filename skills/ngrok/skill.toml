[package]
id = "pjlsergeant/ngrok"
version = "1.0.0"
kind = "skill"
package_api = 1
requires_byre = ">=1.0.0"
description = "ngrok CLI, authenticated from NGROK_AUTHTOKEN at launch, plus ngrok's own expose-localhost Claude Skill for using it well."

[build]
# ngrok CLI + the expose-localhost Claude Skill, so an agent in the box can
# both run ngrok and use it well (port detection, domain/access-control
# questions asked upfront, Traffic Policy for OAuth/rate-limiting/OWASP).
# requires_byre >=1.0.0: needs [[claude_skills]] (ADR 0039, first shipped
# in byre v1.0.0).
#
# ngrok isn't in Debian's default repos, so this block adds ngrok's
# own apt repo before installing the package -- same shape as byre's
# built-in docker-host skill (keyring + sources.list.d + apt-get install),
# just following ngrok's own documented install command
# (https://ngrok.com/download/linux) instead of Docker's.
apt = ["curl", "ca-certificates"]
files = { "ngrok-authtoken-firstrun.sh" = "/etc/byre/firstrun.d/ngrok-authtoken" }
dockerfile = [
  # Verbatim per ngrok's own docs (https://ngrok.com/download/linux); "bookworm"
  # is a fixed suite label on ngrok's flat repo, not derived from the base
  # image's actual codename -- revisit if this skill is ever used on a non-
  # Debian-bookworm template.
  "RUN curl -sSL https://ngrok-agent.s3.amazonaws.com/ngrok.asc -o /etc/apt/trusted.gpg.d/ngrok.asc \\",
  " && echo \"deb https://ngrok-agent.s3.amazonaws.com bookworm main\" > /etc/apt/sources.list.d/ngrok.list \\",
  " && apt-get update \\",
  " && apt-get install -y --no-install-recommends ngrok \\",
  " && rm -rf /var/lib/apt/lists/*",
]

[runtime]
# NGROK_AUTHTOKEN is read by the firstrun hook above, not baked into the
# image -- documented here so the config editor's env screen surfaces it.
env_docs = { NGROK_AUTHTOKEN = "ngrok authtoken (dashboard.ngrok.com/get-started/your-authtoken) -- applied automatically at each launch via `ngrok config add-authtoken`. Provide via env_from_host = { NGROK_AUTHTOKEN = \"env:NGROK_AUTHTOKEN\" } to reuse your host's token, or a literal [env] value." }
# Runtime hosts the ngrok agent connects to (port 443): connect.ngrok-agent.com
# to establish tunnels, api.ngrok.com for auth/domains/cloud-endpoint calls
# (the SKILL.md's "Cloud Endpoints" step), update.equinox.io for self-update
# checks. Source: https://ngrok.com/docs/guides/running-behind-firewalls --
# note the connect host is region-specific past agent v3.3.0 (e.g.
# connect.us.ngrok-agent.com); add your region's if the default doesn't match.
egress = ["connect.ngrok-agent.com", "api.ngrok.com", "update.equinox.io"]

[[volumes]]
# ngrok's own config dir (authtoken, any `ngrok config` state) -- separate
# from the image so a token survives rebuilds even without NGROK_AUTHTOKEN
# set on every launch.
name = "ngrok"
role = "state"
target = "/home/dev/.config/ngrok"

[context]
file = "context.md"

[[claude_skills]]
# Upstream: github.com/ngrok/agent-skills, skills/expose-localhost (MIT --
# see claude-skills/expose-localhost/LICENSE). Repackaged verbatim, same
# attribution approach as this repo's claude-skills-pocock package.
name = "expose-localhost"
from = "claude-skills/expose-localhost"

