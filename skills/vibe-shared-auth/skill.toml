# Offer this as pjlsergeant/vibe's shared-auth companion during onboarding and
# nest it beneath that agent in byre's config UI. This must precede [package]
# so it remains top-level TOML rather than package metadata.
shared_auth_for = "pjlsergeant/vibe"

# A port of pjlsergeant/zai-shared-auth: one static key file in a
# machine-scoped identity volume, exported as an env var. Vibe reads
# MISTRAL_API_KEY from the environment ahead of ~/.vibe/.env (a non-empty
# process value wins, vibe/core/config/vibe_schema.py:99-114), so sharing
# the VARIABLE is enough -- nothing is linked into the .vibe volume, and
# pjlsergeant/vibe's login hook trusts no symlink at ~/.vibe/.env.
# 1.1.0: firstrun.sh also PROMOTES an existing per-project login (the key
# vibe-login's browser sign-in wrote to ~/.vibe/.env, never shown to the
# user) into the shared file when there is none yet -- the
# pjlsergeant/mimo-shared-auth precedent, by value, not by link (dotenv's
# set_key rewrites .env via temp+rename, which would replace a link).
# LIVE-verified in the authoring box (2026-10-06): env.sh's export, its
# respect for a pre-set key, its refusal of a symlinked/empty file, and
# firstrun.sh's non-TTY stand-down. NOT exercised: a byre box mounting the
# volume, and a real Mistral key.

[package]
id = "pjlsergeant/vibe-shared-auth"
version = "1.1.0"
kind = "skill"
package_api = 1
requires_byre = ">=1.0.0"
description = "Share one Mistral login (API key) across byre projects that use pjlsergeant/vibe."

[build]
files = { "firstrun.sh" = "/etc/byre/firstrun.d/00-vibe-shared-auth", "env.sh" = "/etc/byre/env.d/50-vibe-shared-auth.sh" }

[context]
file = "context.md"

[[volumes]]
name = "vibe-identity"
role = "state"
target = "/home/dev/.byre-identity/vibe"
scope = "machine"

# Distribution payload list -- generated by `byre skill pack`.
[[package.files]]
src = "context.md"
dest = "context.md"
sha256 = "1398f607f38784917eaf5e1b865f46b55dfe8aaf7517a63b1a47cf6f3e929a31"

[[package.files]]
src = "env.sh"
dest = "env.sh"
sha256 = "819f91677b6176b8b34ca44961eaf9e10c07e57e8f0aab37f4b20b948578be9e"

[[package.files]]
src = "firstrun.sh"
dest = "firstrun.sh"
sha256 = "199ca328eff4bce55a81f31d7029e62a175346df687e3f1b0517c06490dd57b5"
executable = true

