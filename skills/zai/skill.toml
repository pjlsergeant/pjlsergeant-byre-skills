[package]
id = "pjlsergeant/zai"
version = "1.0.0"
kind = "skill"
package_api = 1
requires_byre = ">=1.3.0"
description = "An isolated `zai` command that configures an existing Codex CLI for Z.AI's GLM Coding Plan without touching other agents' state."

[build]
files = { "zai" = "/usr/local/bin/zai", "config.toml" = "/usr/local/share/byre-zai/config.toml", "models.json" = "/usr/local/share/byre-zai/models.json" }
dockerfile = [
  "RUN chmod 0755 /usr/local/bin/zai",
]

[runtime]
env_docs = { ZAI_API_KEY = "Z.AI API key for the GLM Coding Plan. Forward it from the host with env_from_host = { ZAI_API_KEY = \"env:ZAI_API_KEY\" }; the key remains environment-only." }
egress = ["api.z.ai"]

[context]
file = "context.md"

[agent]
# The built-in Codex skill supplies this adapter and the codex executable.
# The adapter injects byre's canonical MCP configuration and developer context;
# zai wraps it with the isolated Z.AI CODEX_HOME and seeded provider/catalog.
command = "env ZAI_CODEX_BIN=/usr/local/bin/byre-codex-mcp-launch zai --dangerously-bypass-approvals-and-sandbox"
mcp = "inject"
context = "inject"
state = ".zai-codex"

[[volumes]]
name = ".zai-codex"
role = "state"
target = "/home/dev/.zai-codex-home"

# Distribution payload list -- generated by `byre skill pack`.
[[package.files]]
src = "config.toml"
dest = "config.toml"
sha256 = "86e5fff7e352842324a6af3684961e087ee42f25b877b9ae87c28d9fff5d10ae"

[[package.files]]
src = "context.md"
dest = "context.md"
sha256 = "9a2c6c8a438c37bb2085ec14c476d655e663efe28fd826e62bd1d3f6034578f0"

[[package.files]]
src = "models.json"
dest = "models.json"
sha256 = "d7308cdfe65fe8472a540761b2876ec031292da33a121f257260bcaa1a5c0896"

[[package.files]]
src = "zai"
dest = "zai"
sha256 = "4fcb9aa079e7108cacd7686a0055e48ffcb7d95ee9ed0639d24a1f147f4a3be9"
executable = true
