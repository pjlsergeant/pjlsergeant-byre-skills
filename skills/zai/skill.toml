[package]
id = "pjlsergeant/zai"
version = "1.0.0"
kind = "skill"
package_api = 1
requires_byre = ">=1.0.0"
description = "An isolated `zai` command: a private Codex CLI configured for Z.AI's GLM Coding Plan, without touching other agents' state."

[build]
# Codex's standalone installer currently validates SHA256SUMS with an awk
# interval expression unsupported by Debian's mawk. Supply a private awk shim
# for this one installer process instead of changing the image-wide alternative.
apt = ["curl", "ca-certificates", "gawk"]
files = { "zai" = "/usr/local/bin/zai", "config.toml" = "/usr/local/share/byre-zai/config.toml", "models.json" = "/usr/local/share/byre-zai/models.json" }
dockerfile = [
  "RUN install -d /home/dev/.zai-codex-build-bin \\",
  " && ln -s /usr/bin/gawk /home/dev/.zai-codex-build-bin/awk",
  # Install a private Codex distribution. Its packages and entrypoint live in
  # the image, outside the Z.AI state volume and outside ordinary ~/.codex.
  "RUN install -d -o dev -g dev /home/dev/.zai-codex-dist/bin \\",
  # Pin both the installer bytes and Codex release. The installer independently
  # verifies the selected release asset against its published SHA-256 digest.
  " && curl -fsSL https://chatgpt.com/codex/install.sh -o /tmp/zai-codex-install.sh \\",
  " && echo 'ba92dd27e5c06f0d3bbc58bfa4b9cfb6599cd2742fbb1f92a2765e6c07dedb5a  /tmp/zai-codex-install.sh' | sha256sum -c - \\",
  # The installer always manages a shell profile when another Codex install
  # exists. Point HOME at the private distribution too, so even that profile
  # side effect cannot touch /home/dev's real shell configuration.
  " && HOME=/home/dev/.zai-codex-dist CODEX_HOME=/home/dev/.zai-codex-dist CODEX_INSTALL_DIR=/home/dev/.zai-codex-dist/bin CODEX_RELEASE=0.147.0 PATH=/home/dev/.zai-codex-build-bin:$PATH gosu dev sh /tmp/zai-codex-install.sh \\",
  " && test -x /home/dev/.zai-codex-dist/bin/codex \\",
  " && rm -f /tmp/zai-codex-install.sh",
  "RUN chmod 0755 /usr/local/bin/zai",
]

[runtime]
env_docs = { ZAI_API_KEY = "Z.AI API key for the GLM Coding Plan. Forward it from the host with env_from_host = { ZAI_API_KEY = \"env:ZAI_API_KEY\" }; the key remains environment-only." }
egress = ["api.z.ai"]

[context]
file = "context.md"

[[volumes]]
name = ".zai-codex"
role = "state"
target = "/home/dev/.zai-codex-home"

# Distribution payload list -- generated by `byre skill pack`.
[[package.files]]
src = "config.toml"
dest = "config.toml"
sha256 = "86e5fff7e352842324a6af3684961e087ee42f25b877b9ae87c28d9fff5d10ae"

[[package.files]]
src = "context.md"
dest = "context.md"
sha256 = "ef4f05536bdbece0fdcad60c6bc66449a2b6b6557ca798cd885af4cfa40c7a04"

[[package.files]]
src = "models.json"
dest = "models.json"
sha256 = "d7308cdfe65fe8472a540761b2876ec031292da33a121f257260bcaa1a5c0896"

[[package.files]]
src = "zai"
dest = "zai"
sha256 = "e8121ab66682a849c0530722fe73d9daf13718cb3e14fcc2366204c6380f2242"
executable = true
