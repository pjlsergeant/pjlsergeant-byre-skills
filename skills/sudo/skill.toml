[package]
id = "pjlsergeant/sudo"
version = "1.0.0"
kind = "skill"
package_api = 1
requires_byre = ">=0.1.10"
description = "Passwordless sudo for the dev user -- full root inside the box."

[build]
apt = ["sudo"]
# Skill build blocks run as root, before the `USER dev` switch, and the dev
# user already exists (the core block precedes skills). Written by RUN rather
# than shipped as a payload: sudo refuses a group-writable sudoers file, and
# a COPYed payload would carry the checkout's umask bits. The trailing
# `visudo -c` fails the build on a syntax error instead of shipping a box
# where every sudo invocation is broken. 0440 is sudo's required mode.
# The shadow line: byre creates `dev` by editing /etc/passwd directly and
# never writes an /etc/shadow entry, so PAM's account phase fails ("account
# validation failure, is your account locked?") before NOPASSWD is consulted.
# `*` = no password will ever authenticate (sudo here never needs one); the
# empty third field disables password aging (0 there would mean "must change
# at next login", which PAM also refuses). Guarded so a base image that
# already ships a dev shadow entry keeps its own.
dockerfile = ["RUN getent shadow dev >/dev/null || echo 'dev:*::0:99999:7:::' >> /etc/shadow", "RUN echo 'dev ALL=(ALL:ALL) NOPASSWD:ALL' > /etc/sudoers.d/dev && chmod 0440 /etc/sudoers.d/dev && visudo -c"]

[context]
file = "context.md"

# Distribution payload list -- generated by `byre skill pack`.
[[package.files]]
src = "context.md"
dest = "context.md"
sha256 = "8a237366117660f4af4e1c8c416d5ce8d3dd852e4e0100a7d1734135cfa10816"
