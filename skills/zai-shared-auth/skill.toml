# `zai` is an auxiliary command, not a primary [agent], so this intentionally
# does not claim shared_auth_for (which would place it in agent onboarding).

[package]
id = "pjlsergeant/zai-shared-auth"
version = "1.0.0"
kind = "skill"
package_api = 1
requires_byre = ">=1.0.0"
description = "Share one static Z.AI API key across byre projects that use pjlsergeant/zai."

[build]
files = { "firstrun.sh" = "/etc/byre/firstrun.d/00-zai-shared-auth", "env.sh" = "/etc/byre/env.d/50-zai-shared-auth.sh" }

[context]
file = "context.md"

[[volumes]]
name = "zai-identity"
role = "state"
target = "/home/dev/.byre-identity/zai"
scope = "machine"

# Distribution payload list -- generated by `byre skill pack`.
[[package.files]]
src = "context.md"
dest = "context.md"
sha256 = "bcec0516413fab500cfd06881be992c8573a4dbdd0e3eb4150a9c185372fb081"

[[package.files]]
src = "env.sh"
dest = "env.sh"
sha256 = "cbf010ac99f005082a89c3a36015be91ac1ac0e53d0411a90a3ba8037e1c1916"

[[package.files]]
src = "firstrun.sh"
dest = "firstrun.sh"
sha256 = "01e5cc56bc089769ff03ed3b76e3b5135d1684a07ab5a18c10a9bb6f31032723"
executable = true
