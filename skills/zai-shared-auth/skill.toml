# Offer this as pjlsergeant/zai's shared-auth companion during onboarding and
# nest it beneath that agent in byre's config UI. This must precede [package]
# so it remains top-level TOML rather than package metadata.
shared_auth_for = "pjlsergeant/zai"

[package]
id = "pjlsergeant/zai-shared-auth"
version = "1.0.1"
kind = "skill"
package_api = 1
requires_byre = ">=1.0.0"
description = "Share one static Z.AI API key across byre projects that use pjlsergeant/zai."

[build]
files = { "firstrun.sh" = "/etc/byre/firstrun.d/00-zai-shared-auth", "env.sh" = "/etc/byre/env.d/50-zai-shared-auth.sh" }

[context]
file = "context.md"

[[volumes]]
name = "zai-identity"
role = "state"
target = "/home/dev/.byre-identity/zai"
scope = "machine"

# Distribution payload list -- generated by `byre skill pack`.
[[package.files]]
src = "context.md"
dest = "context.md"
sha256 = "d2fa1a10c5c95116cc936508850b07870c98440752a2cc2fb289242ab5673596"

[[package.files]]
src = "env.sh"
dest = "env.sh"
sha256 = "4ee9b21cd8e0bf6c12e57ac9c1ec95bd935cb0ef18449bcaa53ad15f4640e42e"

[[package.files]]
src = "firstrun.sh"
dest = "firstrun.sh"
sha256 = "daa7f22945a8e394d00b50b1815489cab222c01b45922476bd1df0043d456474"
executable = true

